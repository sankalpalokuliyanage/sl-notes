<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SL-NOTEBOOK - Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            user-select: none; 
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            transition: background-color 0.3s;
        }

        #loginPage { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #appContainer { display: none; height: 100vh; flex-direction: column; }
        #homePage { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 250px; padding: 20px; border-right: 1px solid var(--bs-border-color); overflow-y: auto; }
        .content-area { flex: 1; padding: 20px; overflow-y: auto; }
        .folder-item { cursor: pointer; padding: 10px; border-radius: 8px; transition: 0.2s; font-weight: 500; }
        .folder-item:hover { background: var(--bs-tertiary-bg); }
        .folder-item.active { background: #0d6efd; color: white; }

        /* --- Drawing Page --- */
        #drawingPage { display: none; position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        
        #drawingCanvas { display: block; background-color: #ffffff; cursor: crosshair; touch-action: none; }

        /* Floating Toolbar */
        .floating-toolbar {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px);
            border-radius: 50px; padding: 10px 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex; gap: 15px; align-items: center; z-index: 1000; border: 1px solid rgba(255,255,255,0.3);
            width: max-content; max-width: 95%; overflow-x: auto;
        }
        
        [data-bs-theme="dark"] .floating-toolbar { background: rgba(33, 37, 41, 0.7); border: 1px solid rgba(255,255,255,0.1); }
        
        .note-card { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .note-card img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--bs-border-color); cursor: pointer; background: white; }
        .note-actions { padding: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .brand-footer { position: fixed; bottom: 10px; right: 15px; font-size: 0.75rem; font-weight: bold; opacity: 0.6; pointer-events: none; z-index: 9999; }

        .drawing-top-bar {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 1001;
            background: var(--bs-body-bg); border-bottom: 1px solid var(--bs-border-color);
            display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;
        }
        .note-title-input {
            border: none; background: transparent; font-weight: bold; font-size: 1.2rem;
            color: var(--bs-body-color); text-align: center; outline: none; width: 300px;
        }

        .page-turn-next { animation: flipNext 0.6s ease-in-out forwards; }
        .page-turn-prev { animation: flipPrev 0.6s ease-in-out forwards; }

        @keyframes flipNext {
            0% { transform: perspective(1500px) rotateY(0deg); opacity: 1; }
            49% { transform: perspective(1500px) rotateY(-90deg); opacity: 0; }
            50% { transform: perspective(1500px) rotateY(90deg); opacity: 0; }
            100% { transform: perspective(1500px) rotateY(0deg); opacity: 1; }
        }
        @keyframes flipPrev {
            0% { transform: perspective(1500px) rotateY(0deg); opacity: 1; }
            49% { transform: perspective(1500px) rotateY(90deg); opacity: 0; }
            50% { transform: perspective(1500px) rotateY(-90deg); opacity: 0; }
            100% { transform: perspective(1500px) rotateY(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="loginPage" class="bg-body-tertiary">
    <div class="card shadow-lg border-0 p-5 text-center" style="max-width: 400px; border-radius: 20px;">
        <h2 class="fw-bold text-primary mb-3">SL-NOTEBOOK</h2>
        <p class="text-muted mb-4" data-i18n="login_subtitle">Login to continue..</p>
        <button class="btn btn-dark btn-lg rounded-pill" id="btnLoginGoogle" data-i18n="login_btn">Sign in with Google</button>
    </div>
</div>

<div id="appContainer">
    <div class="px-4 py-3 border-bottom d-flex justify-content-between align-items-center bg-body flex-wrap gap-2">
        <div class="d-flex align-items-center gap-3">
            <h3 class="fw-bold text-primary m-0">SL-NOTEBOOK</h3>
            <span class="badge bg-secondary" id="userEmailBadge">user@gmail.com</span>
        </div>
        <div class="d-flex gap-2 align-items-center flex-wrap">
            <select class="form-select form-select-sm rounded-pill w-auto border-secondary" id="languageSelect">
                <option value="en">English</option>
                <option value="si">සිංහල</option>
                <option value="ko">한국어</option>
            </select>
            <button class="btn btn-outline-secondary rounded-circle" id="btnThemeToggle" title="Toggle Dark/Light Mode">🌙</button>
            <button class="btn btn-outline-danger btn-sm rounded-pill" id="btnLogout" data-i18n="logout">Logout</button>
            <button class="btn btn-primary rounded-pill shadow-sm fw-bold" id="btnCreateNote" data-i18n="new_note">✏️ New Note</button>
        </div>
    </div>

    <div id="homePage">
        <div class="main-layout">
            <div class="sidebar bg-body-tertiary">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold text-secondary text-uppercase m-0" data-i18n="folders">Folders</h6>
                    <button class="btn btn-sm btn-primary rounded-circle" id="btnNewFolder">+</button>
                </div>
                <div id="folderList"></div>
            </div>
            <div class="content-area bg-body">
                <h4 class="mb-4 fw-bold" id="currentFolderTitle">All Notes</h4>
                <div class="row g-4" id="notesGrid"></div>
            </div>
        </div>
    </div>

    <div id="drawingPage">
        <div class="drawing-top-bar">
            <button class="btn btn-secondary rounded-pill fw-bold btn-sm" id="btnBack" data-i18n="btn_back">🔙 Back</button>
            
            <input type="text" id="noteTitleInput" class="note-title-input" value="Untitled Note" placeholder="Note Title...">
            
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary rounded-circle" id="btnPrevPage">◀</button>
                <span class="fw-bold text-muted small" id="pageIndicator">1 / 1</span>
                <button class="btn btn-sm btn-outline-secondary rounded-circle" id="btnNextPage">▶</button>
            </div>
        </div>

        <div class="floating-toolbar">
            <div class="btn-group">
                <button class="btn btn-primary active" id="btnPen" data-i18n="btn_pen">✒️ Pen</button>
                <button class="btn btn-outline-primary" id="btnHighlighter" data-i18n="btn_highlighter">🖍️ Highlighter</button>
                <button class="btn btn-outline-primary" id="btnEraser" data-i18n="btn_eraser">🧽 Eraser</button>
            </div>
            
            <input type="color" id="colorPicker" value="#000000" class="form-control form-control-color" style="width:40px; height:40px; padding:2px; border-radius:50%;">
            
            <select id="brushSize" class="form-select w-auto rounded-pill bg-body text-body">
                <option value="2">Thin</option>
                <option value="5" selected>Normal</option>
                <option value="10">Thick</option>
            </select>
            
            <div class="btn-group">
                <button class="btn btn-outline-secondary" id="btnUndo" title="Undo">↩️</button>
                <button class="btn btn-outline-secondary" id="btnRedo" title="Redo">↪️</button>
            </div>

            <button class="btn btn-danger rounded-pill" id="clearBtn" data-i18n="btn_clear">Clear</button>
            <div class="vr mx-1"></div>
            
            <span id="autoSaveIndicator" class="badge bg-light text-muted border px-3 py-2 rounded-pill small">☁️ Saved</span>
        </div>
        
        <canvas id="drawingCanvas"></canvas>
    </div>
</div>

<div class="brand-footer text-body">Developed by Sankalpa Lokuliyanage</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
